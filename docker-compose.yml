services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - portfolio_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"

  portfolio:
    build:
      context: .
      target: production
    ports:
      - "8080:80"

volumes:
  portfolio_node_modules:
